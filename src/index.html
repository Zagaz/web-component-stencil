<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>Stencil Component Starter</title>

    <script type="module" src="/build/web-component-stencil.esm.js"></script>
    <script nomodule src="/build/web-component-stencil.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Arial, sans-serif;
        padding: 10px;
      }
      nav {
        ul {
          display: flex;
          flex-direction: column;
          align-items: center;
          padding: 0 1rem;
          list-style: none;
          li {
            margin-right: 1rem;
            a {
              text-decoration: none;
            }
          }
        }
      }

      #side-drawer-button {
        position: fixed;
        top: 1rem;
        right: 1rem;
        padding: 0.8rem 1.5rem;
        font-size: 1rem;
        cursor: pointer;
        z-index: 1000;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 25px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);

        &:hover {
          transform: translateY(-2px);
          box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        &:active {
          transform: translateY(0);
          box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }
      }
    </style>
  </head>
  <body>
    <button id="side-drawer-button">Click</button>
    <header>
      <ltc-side-drawer title="Lorem Minem Titulum" opened>
        <nav>
          <ul>
            <li><a href="#unum">Unum</a></li>
            <li><a href="#duet">Duet </a></li>
            <li><a href="#trio">Trio</a></li>
          </ul>
        </nav>
      </ltc-side-drawer>
    </header>
    <script>
      const button = document.querySelector('#side-drawer-button');
      const sideDrawer = document.querySelector('ltc-side-drawer');
      button.addEventListener('click', () => {
        sideDrawer.open();
      });
    </script>
  </body>
</html>
