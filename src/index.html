<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>Stencil Component Starter</title>

    <script type="module" src="/build/web-component-stencil.esm.js"></script>
    <script nomodule src="/build/web-component-stencil.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Arial, sans-serif;
        padding: 10px;
      }
      nav {
        ul {
          display: flex;
          flex-direction: column;
          align-items: center;
          padding: 0 1rem;
          list-style: none;
          li {
            margin-right: 1rem;
            a {
              text-decoration: none;
            }
          }
        }
      }

      #side-drawer-button {
        position: fixed;
        top: 1rem;
        right: 1rem;
        padding: 0.5rem 1rem;
        font-size: 1rem;
        cursor: pointer;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <header>
      <ltc-side-drawer title="Lorem Minem Titulum" opened>
        <nav>
          <ul>
            <li><a href="#unum">Unum</a></li>
            <li><a href="#duet">Duet </a></li>
            <li><a href="#trio">Trio</a></li>
          </ul>
        </nav>
        <button id="side-drawer-button">Click</button>
      </ltc-side-drawer>
    </header>
    <script>
      const button = document.querySelector('#side-drawer-button');
      const sideDrawer = document.querySelector('ltc-side-drawer');
      button.addEventListener('click', () => {
        sideDrawer.opened = false
      });
    </script>
  </body>
</html>
